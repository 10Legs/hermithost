services:
  # ── Reverse Proxy ──────────────────────────────────────────────
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=hermithost-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_HTTPS_PORT:-8443}:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks:
      - hermithost-net

  # ── SvelteKit Dashboard ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - hermithost-net
    restart: unless-stopped

  # ── Node.js API ────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      CORS_ORIGIN: "*"
      SITES_DIR: "/app/sites"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      COOLIFY_API_URL: "${COOLIFY_API_URL:-}"
      COOLIFY_API_TOKEN: "${COOLIFY_API_TOKEN:-}"
      TECHNITIUM_URL: "${TECHNITIUM_URL:-}"
      TECHNITIUM_TOKEN: "${TECHNITIUM_TOKEN:-}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    volumes:
      - hermithost-sites:/app/sites
    networks:
      - hermithost-net
    restart: unless-stopped

networks:
  hermithost-net:
    driver: bridge

volumes:
  hermithost-sites:
  traefik-acme:
