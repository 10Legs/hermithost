services:
  # ── Coolify — Deployment Engine ────────────────────────────────
  coolify:
    image: "ghcr.io/coollabsio/coolify:latest"
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coolify-storage:/var/www/html/storage/app
    environment:
      APP_ENV: "production"
      APP_ID: "${COOLIFY_APP_ID}"
      APP_NAME: "Coolify"
      APP_KEY: "${COOLIFY_APP_KEY}"
      DB_CONNECTION: "pgsql"
      DB_HOST: "coolify-db"
      DB_PORT: "5432"
      DB_DATABASE: "coolify"
      DB_USERNAME: "coolify"
      DB_PASSWORD: "${COOLIFY_DB_PASSWORD}"
      REDIS_HOST: "coolify-redis"
      REDIS_PASSWORD: "${COOLIFY_REDIS_PASSWORD}"
      PUSHER_APP_ID: "${COOLIFY_PUSHER_APP_ID}"
      PUSHER_APP_KEY: "${COOLIFY_PUSHER_APP_KEY}"
      PUSHER_APP_SECRET: "${COOLIFY_PUSHER_APP_SECRET}"
      ROOT_USER_EMAIL: "${COOLIFY_ADMIN_EMAIL}"
      ROOT_USER_PASSWORD: "${COOLIFY_ADMIN_PASSWORD}"
      PHP_MEMORY_LIMIT: "256M"
    ports:
      - "${COOLIFY_PORT:-8000}:8080"
    depends_on:
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
      coolify-realtime:
        condition: service_healthy
    networks:
      - hermithost-net
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health || exit 1
      interval: 10s
      retries: 15
      timeout: 3s

  coolify-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "coolify"
      POSTGRES_PASSWORD: "${COOLIFY_DB_PASSWORD}"
      POSTGRES_DB: "coolify"
    volumes:
      - coolify-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - hermithost-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolify -d coolify"]
      interval: 5s
      retries: 10
      timeout: 2s

  coolify-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --loglevel warning --requirepass ${COOLIFY_REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${COOLIFY_REDIS_PASSWORD}"
    volumes:
      - coolify-redis:/data
    networks:
      - hermithost-net
    healthcheck:
      test: redis-cli -a ${COOLIFY_REDIS_PASSWORD} ping
      interval: 5s
      retries: 10
      timeout: 2s

  coolify-realtime:
    image: "ghcr.io/coollabsio/coolify-realtime:1.0.13"
    restart: unless-stopped
    environment:
      APP_NAME: "Coolify"
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: "${COOLIFY_PUSHER_APP_ID}"
      SOKETI_DEFAULT_APP_KEY: "${COOLIFY_PUSHER_APP_KEY}"
      SOKETI_DEFAULT_APP_SECRET: "${COOLIFY_PUSHER_APP_SECRET}"
      SOKETI_HOST: "0.0.0.0"
    networks:
      - hermithost-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s

  # ── step-ca Init (one-shot) ───────────────────────────────────
  # Generates the HermitHost root CA and ACME provisioner on first boot.
  # Idempotent: skips if /home/step/config/ca.json already exists.
  # Only runs in internal mode: docker compose --profile internal up
  step-ca-init:
    image: smallstep/step-ca:latest
    user: root
    profiles: [internal]
    entrypoint: ["/bin/sh", "/scripts/step-ca-init.sh"]
    volumes:
      - step-ca-data:/home/step
      - ./scripts/step-ca-init.sh:/scripts/step-ca-init.sh:ro
    networks:
      - hermithost-net
    restart: "no"

  # ── step-ca (Local Certificate Authority) ─────────────────────
  # Issues TLS certificates for .hh domains in internal mode.
  # Traefik uses this as the ACME CA instead of Let's Encrypt.
  # Only runs in internal mode: docker compose --profile internal up
  step-ca:
    image: smallstep/step-ca:latest
    profiles: [internal]
    # Run as root so the entrypoint shim can write /etc/resolv.conf before
    # handing off to step-ca (which handles its own uid internally).
    user: root
    # Wrapper writes resolv.conf to 172.28.0.10 (Technitium) on every start,
    # regardless of whether the container was --force-recreated or just restarted.
    # This makes DNS correct even when docker dns: is not re-applied on restart.
    entrypoint: ["/bin/sh", "/scripts/step-ca-entrypoint.sh"]
    command: ["/home/step/config/ca.json"]
    volumes:
      - step-ca-data:/home/step
      - ./scripts/step-ca-entrypoint.sh:/scripts/step-ca-entrypoint.sh:ro
    networks:
      - hermithost-net
    restart: unless-stopped
    depends_on:
      step-ca-init:
        condition: service_completed_successfully
      technitium:
        condition: service_healthy
    # step-ca binds :9000; curl is not in the image so we use wget (busybox).
    # -k: self-signed root during first boot is acceptable here.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:9000/health || exit 1"]
      interval: 10s
      retries: 12
      timeout: 5s
    # Technitium is the authoritative resolver for .hh — step-ca must use it
    # directly so ACME DNS-01 challenge TXT lookups resolve correctly.
    # Pinned IP matches the static address assigned to technitium below.
    # Note: dns: is only applied at container creation; the entrypoint shim
    # above enforces it on every start as a belt-and-suspenders guarantee.
    dns:
      - 172.28.0.10

  # ── Coolify Keys Init (one-shot) ──────────────────────────────
  coolify-keys-init:
    image: alpine
    restart: "no"
    volumes:
      - coolify-keys:/coolify-keys
    command: >
      sh -c "apk add --no-cache openssh-client -q &&
        if [ ! -f /coolify-keys/hermithost_deploy ]; then
          ssh-keygen -t ed25519 -f /coolify-keys/hermithost_deploy -N '' -C 'coolify@hermithost' -q &&
          echo '[keys-init] Key generated.';
        else echo '[keys-init] Key exists, reusing.'; fi"

  # ── SSH Bridge ────────────────────────────────────────────────
  ssh-bridge:
    build:
      context: ./docker/ssh-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      coolify-keys-init:
        condition: service_completed_successfully
    volumes:
      - coolify-keys:/coolify-keys:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ssh-bridge-host-keys:/etc/ssh/host_keys
    networks:
      - hermithost-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22 || exit 1"]
      interval: 5s
      retries: 12
      timeout: 2s

  # ── Coolify Server Setup (one-shot) ───────────────────────────
  coolify-server-setup:
    image: alpine
    restart: "no"
    depends_on:
      coolify:
        condition: service_healthy
      coolify-db:
        condition: service_healthy
      ssh-bridge:
        condition: service_healthy
      technitium:
        condition: service_healthy
    volumes:
      - coolify-keys:/coolify-keys
      - coolify-api-token:/coolify-api-token
      - ./scripts/coolify-setup.sh:/setup.sh:ro
    environment:
      COOLIFY_API_TOKEN: "${COOLIFY_API_TOKEN}"
      TECHNITIUM_URL: "${TECHNITIUM_URL:-http://technitium:5380}"
      PGHOST: "coolify-db"
      PGPORT: "5432"
      PGDATABASE: "coolify"
      PGUSER: "coolify"
      PGPASSWORD: "${COOLIFY_DB_PASSWORD}"
    command: >
      sh -c "apk add --no-cache openssh-client curl jq postgresql-client -q && sh /setup.sh"
    networks:
      - hermithost-net

  # ── Reverse Proxy ──────────────────────────────────────────────
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    # required: false — enforced only when step-ca is scheduled (--profile internal).
    # Silently skipped in internet mode. Requires Compose v2.20+ (running v5.1.1).
    depends_on:
      step-ca:
        condition: service_healthy
        required: false
    command:
      - "--providers.file.directory=/etc/traefik/conf.d"
      - "--providers.file.watch=true"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--entrypoints.admin.address=:9080"
      - "--entrypoints.https.http.tls.certresolver=letsencrypt"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      # ── Internal CA resolver (step-ca, DNS-01 via RFC2136) ────────
      - "--certificatesresolvers.internal-ca.acme.caserver=https://step-ca:9000/acme/acme/directory"
      - "--certificatesresolvers.internal-ca.acme.dnschallenge=true"
      - "--certificatesresolvers.internal-ca.acme.dnschallenge.provider=rfc2136"
      - "--certificatesresolvers.internal-ca.acme.dnschallenge.resolvers=technitium:53"
      - "--certificatesresolvers.internal-ca.acme.email=internal@hermithost.hh"
      - "--certificatesresolvers.internal-ca.acme.storage=/acme/internal-acme.json"
      # ── Access logging (JSON) ───────────────────────────────────────────────
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/traefik-access.log"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Referer=keep"
      # ── Prometheus metrics ──────────────────────────────────────────────────
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--ping=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      # Trust step-ca root CA so Lego can negotiate with it.
      # Only set when running with --profile internal; empty value is
      # ignored by Traefik so the letsencrypt resolver works unimpaired.
      LEGO_CA_CERTIFICATES: "${LEGO_CA_CERTIFICATES:-}"
      # RFC2136 DNS-01 provider config for the internal-ca resolver.
      # Consumed by Lego's rfc2136 driver; ignored when TSIG secret is empty
      # (Internet mode — letsencrypt resolver is used instead).
      RFC2136_NAMESERVER: "technitium:53"
      RFC2136_TSIG_ALGORITHM: "hmac-sha256."
      RFC2136_TSIG_KEY: "hermithost-acme."
      RFC2136_TSIG_SECRET: "${RFC2136_TSIG_SECRET:-}"
      # Force Lego's pre-validation DNS check to query Technitium directly.
      # Docker's embedded DNS does not know the .hh zone (R3 in risk register).
      LEGO_DNS_RESOLVERS: "technitium:53"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_HTTPS_PORT:-8443}:443"
      - "9080:9080"
    volumes:
      - ./traefik/conf.d:/etc/traefik/conf.d
      - traefik-acme:/acme
      - step-ca-data:/home/step:ro
      - traefik-logs:/logs
    networks:
      - hermithost-net
      - coolify

  # ── SvelteKit Dashboard ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ORIGIN: "http://api:3001"
    networks:
      - hermithost-net
    restart: unless-stopped

  # ── Docker Socket Proxy (label-gated sidecar) ─────────────────
  docker-proxy:
    build:
      context: ./sidecar/docker-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hermithost-net

  # ── Node.js API ────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      SITES_DIR: "/app/sites"
      COOLIFY_API_URL: "http://coolify:8080/api/v1"
      COOLIFY_API_TOKEN: "${COOLIFY_API_TOKEN}"
      TECHNITIUM_URL: "${TECHNITIUM_URL:-http://technitium:5380}"
      TECHNITIUM_TOKEN: "${TECHNITIUM_TOKEN:-}"
      DNS_MOCK: "${DNS_MOCK:-}"
      DNS_PROVIDER: "${DNS_PROVIDER:-technitium}"
      CLOUDFLARE_TOKEN: "${CLOUDFLARE_TOKEN:-}"
      NS_HOSTNAME: "${NS_HOSTNAME:-}"
      NS_SERVER_IP: "${NS_SERVER_IP:-}"
      HERMITHOST_PORT_MODE: "${HERMITHOST_PORT_MODE:-}"
      PUBLIC_BASE_PORT_HTTP: "${PUBLIC_BASE_PORT_HTTP:-8080}"
      PUBLIC_BASE_PORT_HTTPS: "${PUBLIC_BASE_PORT_HTTPS:-8443}"
      TRAEFIK_LOG_PATH: "/traefik-logs/traefik-access.log"
      STATS_INGEST_INTERVAL_MS: "${STATS_INGEST_INTERVAL_MS:-60000}"
      DATA_DIR: "/app/data/lifecycle"
      HERMITHOST_PASSWORD: "${HERMITHOST_PASSWORD}"
      COOKIE_SECRET: "${COOKIE_SECRET}"
      PGHOST: "coolify-db"
      PGPORT: "5432"
      PGDATABASE: "coolify"
      PGUSER: "coolify"
      PGPASSWORD: "${COOLIFY_DB_PASSWORD}"
      DOCKER_PROXY_URL: "http://docker-proxy:2375"
    volumes:
      - hermithost-sites:/app/sites
      - coolify-api-token:/coolify-api-token
      - coolify-keys:/coolify-keys:ro
      - ./traefik/conf.d:/app/traefik-conf.d
      - step-ca-data:/home/step:ro
      - traefik-logs:/traefik-logs:ro
      - hermithost-stats:/app/data
      - ./data:/app/data/lifecycle
    networks:
      - hermithost-net
      - coolify
    restart: unless-stopped
    depends_on:
      coolify:
        condition: service_healthy
      coolify-server-setup:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started

  # ── Sites Restore (one-shot) ───────────────────────────────────
  # Restores coolify-managed containers checkpointed by stack-down.sh.
  # Only acts if data/restore-containers.json exists (written by controlled shutdown).
  sites-restore:
    image: docker:cli
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/restore-data
    depends_on:
      coolify:
        condition: service_healthy
      coolify-server-setup:
        condition: service_completed_successfully
    command: >
      sh -c "
        FILE=/restore-data/restore-containers.json
        EVENT_FILE=/restore-data/restore-event.json
        if [ ! -f \"$$FILE\" ]; then
          echo '[sites-restore] No restore checkpoint — skipping.'
          exit 0
        fi
        TOTAL=$$(cat \"$$FILE\" | grep -c '\"id\"' || echo 0)
        if [ \"$$TOTAL\" -eq 0 ]; then
          echo '[sites-restore] Empty restore list — skipping.'
          rm -f \"$$FILE\"
          exit 0
        fi
        echo \"[sites-restore] Restoring $$TOTAL container(s)...\"
        RESTORED=0
        FAILED=''
        while IFS= read -r line; do
          ID=$$(echo \"$$line\" | sed 's/.*\"id\": *\"\([^\"]*\)\".*/\1/' | grep -E '^[a-f0-9]+$$')
          NAME=$$(echo \"$$line\" | sed 's/.*\"name\": *\"\([^\"]*\)\".*/\1/')
          [ -z \"$$ID\" ] && continue
          if docker start \"$$ID\" > /dev/null 2>&1; then
            echo \"[sites-restore] Started: $$NAME ($$ID)\"
            RESTORED=$$((RESTORED+1))
          else
            echo \"[sites-restore] Failed: $$NAME ($$ID)\"
            FAILED=\"$$FAILED,\\\"$$NAME\\\"\"
          fi
        done < <(cat \"$$FILE\" | tr '{' '\n' | grep '\"id\"')
        FAILED_JSON=\"[$$(echo $$FAILED | sed 's/^,//')]\";
        printf '{\"total\":%d,\"restored\":%d,\"failed\":%s,\"at\":\"%s\"}' \
          $$TOTAL $$RESTORED \"$$FAILED_JSON\" \"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > \"$$EVENT_FILE\"
        rm -f \"$$FILE\"
        echo '[sites-restore] Done.'
      "
    networks:
      - hermithost-net

  # ── Technitium DNS Server ──────────────────────────────────────
  technitium:
    build:
      context: ./docker/technitium
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5380:5380"                 # Technitium web UI / API (localhost only)
      - "${DNS_PORT:-53053}:53/udp"          # DNS queries (UDP)
      - "${DNS_PORT:-53053}:53/tcp"          # DNS queries (TCP)
    volumes:
      - technitium-config:/etc/dns
    networks:
      hermithost-net:
        # Static IP so step-ca dns: block and RFC2136_NAMESERVER can reference
        # a stable address rather than a hostname (Docker dns: validates IPs only).
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5380/api/user/login?user=admin&pass=admin > /dev/null 2>&1 || exit 1"]
      interval: 5s
      retries: 12
      timeout: 3s

networks:
  hermithost-net:
    driver: bridge
    # Explicit subnet required to pin Technitium's IP (172.28.0.10).
    # step-ca dns: and Traefik RFC2136_NAMESERVER both reference this address.
    # Operators upgrading from an auto-assigned subnet must run setup.sh again
    # (TSIG ACL in technitium-tsig-init.sh is re-registered from the new CIDR).
    ipam:
      config:
        - subnet: 172.28.0.0/24
  coolify:
    external: true
    name: coolify

volumes:
  hermithost-sites:
  traefik-acme:
  technitium-config:
  coolify-storage:
  coolify-db:
  coolify-redis:
  coolify-keys:
  coolify-api-token:
  ssh-bridge-host-keys:
  step-ca-data:
  traefik-logs:
  hermithost-stats:
