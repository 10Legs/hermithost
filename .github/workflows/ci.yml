name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-api:
    name: Typecheck API
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  typecheck-frontend:
    name: Typecheck Frontend
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx tsc --noEmit

  build-frontend:
    name: Build Frontend
    runs-on: self-hosted
    needs: typecheck-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  build-api:
    name: Build API
    runs-on: self-hosted
    needs: typecheck-api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker Build
    # Self-hosted for persistent layer cache — images don't need to be pushed here
    runs-on: self-hosted
    needs: [build-frontend, build-api]
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t hermithost-frontend:ci-${{ github.sha }} .
      - name: Build API image
        run: docker build -t hermithost-api:ci-${{ github.sha }} ./api
      - name: Clean up CI images
        if: always()
        run: |
          docker rmi hermithost-frontend:ci-${{ github.sha }} || true
          docker rmi hermithost-api:ci-${{ github.sha }} || true
