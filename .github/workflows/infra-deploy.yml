name: Infra Deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated services to redeploy (leave blank for full stack)'
        type: string
        default: ''

# One infra deploy at a time
concurrency:
  group: infra-deploy-production
  cancel-in-progress: false

jobs:
  infra-deploy:
    name: Infra Deploy to Production
    runs-on: [self-hosted, hammer]
    environment: production

    env:
      COMPOSE_PROJECT: hermithost
      STACK_DIR: ${{ vars.STACK_DIR || '/Users/rdemeritt/projects/hermithost' }}

    defaults:
      run:
        working-directory: ${{ vars.STACK_DIR || '/Users/rdemeritt/projects/hermithost' }}

    steps:
      # ── Preflight ─────────────────────────────────────────────────────────────
      - name: Preflight — verify .env exists
        run: |
          if [ ! -f .env ]; then
            echo "ERROR: .env not found at $STACK_DIR"
            exit 1
          fi
          echo "✓ .env found"

      # ── Sync live stack to latest commit ──────────────────────────────────────
      - name: Sync live stack to latest
        run: |
          git fetch origin
          git reset --hard ${{ github.sha }}
          echo "✓ Live stack at $(git rev-parse --short HEAD)"

      # ── Deploy ────────────────────────────────────────────────────────────────
      - name: Deploy infra services
        run: |
          SERVICES="${{ inputs.services }}"
          if [ -z "$SERVICES" ]; then
            echo "Full stack deploy — rebuilding all services"
            docker compose -p $COMPOSE_PROJECT --env-file .env up -d --build
          else
            echo "Targeted deploy — services: $SERVICES"
            docker compose -p $COMPOSE_PROJECT --env-file .env up -d --build $SERVICES
          fi

      # ── Health checks ─────────────────────────────────────────────────────────
      - name: Health check — API (via Traefik :9080/api/health)
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:9080/api/health > /dev/null; then
              echo "✓ API healthy (attempt $i)"
              exit 0
            fi
            echo "  waiting... ($i/15)"
            sleep 2
          done
          echo "✗ API health check failed after 30s"
          exit 1

      - name: Health check — Management UI (via Traefik :9080)
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:9080 > /dev/null; then
              echo "✓ Management UI healthy (attempt $i)"
              exit 0
            fi
            echo "  waiting... ($i/15)"
            sleep 2
          done
          echo "✗ Management UI health check failed after 30s"
          exit 1

      # ── Prune dangling images ──────────────────────────────────────────────────
      - name: Prune dangling images
        if: success()
        run: docker image prune -f
