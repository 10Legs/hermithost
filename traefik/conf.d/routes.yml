http:
  routers:
    # ── HermitHost Admin UI ───────────────────────────────────────
    # Fallback: serves admin when no site-specific Host rule matches.
    # Site routers (higher priority via longer rule) take precedence.
    api:
      rule: "PathPrefix(`/api`)"
      priority: 10
      entryPoints:
        - http
        - https
      service: api

    frontend:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - http
        - https
      service: frontend

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:3001"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
