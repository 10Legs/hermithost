http:
  routers:
    # ── HermitHost Admin UI — named domain (cert-eligible) ────────────────────
    # Host-based routers win over PathPrefix fallbacks via higher auto-priority.
    api-admin:
      rule: "Host(`hermithost.shallowfordroad.com`) && PathPrefix(`/api`)"
      entryPoints:
        - http
        - https
      service: api

    frontend-admin:
      rule: "Host(`hermithost.shallowfordroad.com`)"
      entryPoints:
        - http
        - https
      service: frontend

    # ── Fallback: no-host catch-all ────────────────────────────────────────────
    # Serves admin when no site-specific Host rule matches (e.g., direct IP access).
    # No TLS cert — no hostname for ACME to target.
    api:
      rule: "PathPrefix(`/api`)"
      priority: 10
      entryPoints:
        - http
        - https
      service: api

    frontend:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - http
        - https
      service: frontend

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:3001"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
